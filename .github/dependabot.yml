# Weekly version updates, grouped so minor and patch bumps arrive as one PR per
# ecosystem. Majors stay separate PRs because they can need code changes.
# Security updates (Settings › Code security) follow the same groups.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Skip releases younger than this, so a compromised or yanked publish
    # usually gets caught before it reaches a PR.
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
