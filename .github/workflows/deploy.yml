# Builds every push and pull request. Pushes to main deploy to production; each
# pull request gets a Workers Preview at pr-<number>-allenhansen-dev.ameh64.workers.dev,
# commented on the pull request and deleted when it closes.
#
# Needs the CLOUDFLARE_API_TOKEN repository secret (see README › Deploying).
# Without it, the build still runs and the deploy steps are skipped.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  site:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          # rehype-mermaid only needs Chromium; the next step installs it with its system libraries.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build

      - name: Deploy to production
        if: github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm exec wrangler deploy

      - name: Deploy Preview
        id: preview
        if: >-
          github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
          && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -o pipefail
          output="$(pnpm exec wrangler preview --name "pr-${{ github.event.pull_request.number }}" --message "${{ github.event.pull_request.head.sha }}" --json)"
          printf '%s\n' "$output"
          echo "url=$(printf '%s' "$output" | jq -er '.preview.urls[0]')" >> "$GITHUB_OUTPUT"
      - name: Check the Preview responds
        if: steps.preview.outputs.url
        run: |
          URL="${URL%/}"
          curl --fail --silent --show-error --output /dev/null "$URL/"
          curl --fail --silent --show-error --output /dev/null "$URL/blog/rss.xml"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$URL/no-such-page/")" = 404
        env:
          URL: ${{ steps.preview.outputs.url }}
      - name: Comment the Preview URL
        if: steps.preview.outputs.url
        run: >-
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last
          --create-if-none --body "Preview: ${{ steps.preview.outputs.url }}
          (commit ${{ github.event.pull_request.head.sha }})"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  delete-preview:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete Preview
        if: env.CLOUDFLARE_API_TOKEN != ''
        run:
          npx --yes wrangler@4.151.0 preview delete --name "pr-${{
          github.event.pull_request.number }}" --skip-confirmation
